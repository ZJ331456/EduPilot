<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于nano-graphrag知识库的智能学习系统">
    <meta name="keywords" content="AI学习助手,多智能体,知识图谱,苏格拉底式教学">
    <title>多智能体学习助手</title>
    <link rel="stylesheet" href="css/multi_agent_interface.css?v=2.0.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🤖 多智能体学习助手</h1>
            <p>基于nano-graphrag知识库的智能学习系统</p>
        </header>

        <main class="main-content">
            <!-- 边栏切换按钮 -->
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换边栏">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            
            <!-- 边栏遮罩层 -->
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            
            <!-- 可折叠边栏 -->
            <aside class="sidebar-left collapsible-sidebar" id="collapsibleSidebar">
                <!-- 用户中心 - 移到最上方 -->
                <section class="panel">
                    <h3>👤 用户中心</h3>
                    <button class="btn btn-primary user-profile-nav-btn" id="userProfileNavBtn" style="width: 100%; margin-bottom: 15px;">
                        👤 用户画像
                    </button>
                </section>

                <section class="panel">
                    <h3>📊 学习状态</h3>
                    <div class="status-item">
                        <span class="status-label">连接状态</span>
                        <span class="status-value" id="connectionStatus">离线 <span class="status-indicator offline"></span></span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">当前会话</span>
                        <span class="status-value" id="sessionId">未开始</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">处理状态</span>
                        <span class="status-value" id="processingStatus">空闲</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">成功率</span>
                        <span class="status-value" id="successRate">--</span>
                    </div>
                </section>

                <!-- 对话记录 -->
                <section class="panel">
                    <h3>💬 对话记录</h3>
                    <div class="conversation-management">
                        <button class="btn btn-primary" id="newConversationBtn" style="width: 100%; margin-bottom: 15px;">
                            ➕ 新建对话
                        </button>
                        

                        
                        <!-- 历史对话列表 -->
                        <div class="sidebar-conversation-history">
                            <h4 style="margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-secondary);">📋 历史对话</h4>
                            <div class="sidebar-conversation-list" id="sidebarConversationList">
                                <div class="empty-state" style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">
                                    暂无历史对话
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <h3>🔄 学习流程</h3>
                    <div class="workflow-steps" id="workflowSteps">
                        <div class="workflow-step" data-step="query_interpreter">🔍 查询解释</div>
                        <div class="workflow-step" data-step="knowledge_retriever">📚 知识检索</div>
                        <div class="workflow-step" data-step="user_profile">👤 用户画像</div>
                        <div class="workflow-step" data-step="socratic_guide">🤔 苏格拉底引导</div>
                        <div class="workflow-step" data-step="planner">📋 规划制定</div>
                        <div class="workflow-step" data-step="executor">💬 执行响应</div>
                        <div class="workflow-step" data-step="learner">📈 学习反馈</div>
                    </div>
                </section>

                <!-- 操作部分 - 移到最下方 -->
                <section class="panel">
                    <h3>⚙️ 操作</h3>
                    <button class="btn btn-secondary" id="clearChatBtn" style="width: 100%; margin-bottom: 10px;">清空对话</button>
                    <button class="btn btn-secondary" id="refreshStatusBtn" style="width: 100%; margin-bottom: 10px;">刷新状态</button>
                    <button class="btn btn-secondary" id="downloadChatBtn" style="width: 100%;">导出对话</button>
                </section>

            </aside>

            <!-- 初始欢迎界面 -->
            <section class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="welcome-header">
                        <h1 class="welcome-title">🤖 多智能体学习助手</h1>
                        <p class="welcome-subtitle">基于nano-graphrag知识库的智能学习系统，通过苏格拉底式对话帮助您深入理解知识</p>
                    </div>
                    <div class="welcome-input-container">
                        <div class="input-group welcome-input-group">
                            <input type="text" id="welcomeMessageInput" placeholder="💭 请输入您想要学习的问题..." maxlength="500" aria-label="输入消息">
                            <button class="btn btn-primary" id="welcomeSendButton" aria-label="发送消息">发送</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 聊天界面 -->
            <section class="chat-container" id="chatContainer" style="display: none;">
                <header class="chat-header">
                    <h2>💬 智能对话</h2>
                    <p>与AI助手进行苏格拉底式学习对话</p>
                </header>
                <div class="chat-messages" id="chatMessages">
                    <div class="learning-progress">
                        <div class="learning-progress-bar" id="learningProgress"></div>
                    </div>
                </div>
                <footer class="chat-input">
                    <div class="input-group">
                        <input type="text" id="messageInput" placeholder="💭 请输入您想要学习的问题..." maxlength="500" aria-label="输入消息">
                        <button class="btn btn-primary" id="sendButton" aria-label="发送消息">发送</button>
                    </div>
                </footer>
            </section>


        </main>
    </div>

    <!-- 通知组件 -->
    <div id="notificationContainer" class="notification-container"></div>

    <!-- 加载指示器 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>处理中...</p>
        </div>
    </div>

    <!-- 对话历史模态框 -->
    <div id="conversationHistoryModal" class="modal" style="display: none;">
        <div class="modal-content conversation-history-modal">
            <div class="modal-header">
                <h3>💬 对话历史管理</h3>
                <button class="modal-close" id="closeConversationHistoryModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="conversation-history-controls">
                    <button class="btn btn-primary" id="createNewConversationBtn">
                        ➕ 创建新对话
                    </button>
                    <button class="btn btn-secondary" id="refreshConversationListBtn">
                        🔄 刷新列表
                    </button>
                </div>
                <div class="conversation-list" id="conversationList">
                    <div class="loading-text">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/multi_agent_interface.js"></script>
</body>
</html>
